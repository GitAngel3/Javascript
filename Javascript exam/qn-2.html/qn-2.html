<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lottery Picker</title>
    <style>
        body {
            margin: 60px;
            border: 6px solid color( rgb(13, 13, 13));
            background-color: rgb(162, 253, 176);
            text-align: center;
        }
        
    </style>

  
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
</head>

<body class="p-4">

    <h2>Lottery Ticket Draw</h2>

    
    <h3 id="winnerDisplay" class="mt-3" style="color: red;"></h3>


    <button class="btn btn-primary mt-3" onclick="pickWinner()">Select Winner</button>

    <div class="modal fade" id="winnerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                
                <div class="modal-header">
                    <h5 class="modal-title">Winner is:</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body">
                    <h3 id="modalWinner" class="text-danger"></h3>
                </div>
                
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>

            </div>
        </div>
    </div>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
     
        const lotteryNumbers = [101, 202, 303, 404, 505, 606, 707];

        function pickWinner() {
          
            const winner = lotteryNumbers[Math.floor(Math.random() * lotteryNumbers.length)];

          
            console.log("Winner is:", winner);

           
            document.getElementById("winnerDisplay").innerText = "Winner: " + winner;

            
            document.getElementById("modalWinner").innerText = winner;

            const modal = new bootstrap.Modal(document.getElementById("winnerModal"));
            modal.show();
        }
    </script>

</body>
</html>
