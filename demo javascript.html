<!DOCTYPE html>
<html lang="en">
<head>
<body>


<script>
    // Function that accepts a friend object
function showFriendInfo(friend) {
    console.log("Friend's Name: " + friend.name);
    console.log("Friend's Age: " + friend.age);
    console.log("Friend's City: " + friend.city);
}

// Creating a friend object
let friend1 = {
    name: "Rahul",
    age: 22,
    city: "Mumbai"
};

// Calling the function and passing the object
showFriendInfo(friend1);


</script>

    
</body>
</html>
