

<!DOCTYPE html>
<html>
<head>
    <title>Print Paragraph Content</title>
</head>
<body>

    <p id="myPara">This is a sample paragraph content.</p>

    <button onclick="printParagraph()">Click Me</button>

    <p id="output"></p>

    <script>
        function printParagraph() {
            // Get paragraph text
            let text = document.getElementById("myPara").innerText;

            // Print in console
            console.log(text);

            // Print on HTML page
            document.getElementById("output").innerText = text;
        }
    </script>

</body>
</html>
