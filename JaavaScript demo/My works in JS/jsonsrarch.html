<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo List with Search</title>

    <!-- Bootstrap CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h3 class="text-center mb-4">Todo List</h3>

    <!-- Search Box -->
    <input 
        type="text" 
        id="searchInput" 
        class="form-control mb-3" 
        placeholder="Search by title..."
        onkeyup="searchTitle()">

    <!-- Table -->
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>User ID</th>
                <th>ID</th>
                <th>Title</th>
                <th>Completed</th>
            </tr>
        </thead>
        <tbody id="todoTable">
            <!-- Table rows will appear here -->
        </tbody>
    </table>
</div>

<script>
    // API URL
    const apiUrl = "https://jsonplaceholder.typicode.com/todos/";

    // Fetch API data
    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            const tableBody = document.getElementById("todoTable");

            // Loop through each todo item and add it to the table
            data.forEach(todo => {
                const row = `
                    <tr>
                        <td>${todo.userId}</td>
                        <td>${todo.id}</td>
                        <td>${todo.title}</td>
                        <td>${todo.completed}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        })
        .catch(error => {
            console.error("Error fetching data:", error);
        });

    // Search function to filter by title
    function searchTitle() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const rows = document.querySelectorAll("#todoTable tr");

        rows.forEach(row => {
            const titleCell = row.cells[2]; // Title column
            if (titleCell) {
                const text = titleCell.textContent.toLowerCase();
                row.style.display = text.includes(input) ? "" : "none";
            }
        });
    }
</script>

</body>
</html>
