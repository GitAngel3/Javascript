<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fetch Todos</title>

    <!-- Bootstrap CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h3 class="text-center mb-4">Todo List</h3>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>User ID</th>
                <th>ID</th>
                <th>Title</th>
                <th>Completed</th>
            </tr>
        </thead>
        <tbody id="todoTable">
            <!-- Rows will be added here -->
        </tbody>
    </table>
</div>

<script>
    // API URL
    const apiUrl = "https://jsonplaceholder.typicode.com/todos/";

    // Fetch data from API
    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {

            const tableBody = document.getElementById("todoTable");

            // Loop through all todos
            data.forEach(todo => {

                const row = `
                    <tr>
                        <td>${todo.userId}</td>
                        <td>${todo.id}</td>
                        <td>${todo.title}</td>
                        <td>${todo.completed}</td>
                    </tr>
                `;

                tableBody.innerHTML += row;
            });
        })
        .catch(error => {
            console.error("Error fetching data:", error);
        });
</script>

</body>
</html>
