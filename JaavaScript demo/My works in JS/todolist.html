<!DOCTYPE html>
<html>
<head>
    <title>Simple To Do List</title>
</head>
<body>

    <p>This page allows you to enter a simple To-Do list.</p>

    <input type="text" id="todoInput" placeholder="Enter a to-do item">
    <button onclick="printTodo()">Add To-Do</button>

    <ul id="todoList"></ul>

    <script>
        function printTodo() {
            // Get user input
            let todo = document.getElementById("todoInput").value;

            // Print in console
            console.log(todo);

            // Print on HTML page
            let listItem = document.createElement("li");
            listItem.innerText = todo;
            document.getElementById("todoList").appendChild(listItem);

            // Clear input field
            document.getElementById("todoInput").value = "";
        }
    </script>

</body>
</html>
