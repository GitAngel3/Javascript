<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            margin: 60px;
            border: 6px solid rgb(13, 13, 13); /* FIXED */
            background-color: rgb(197, 146, 244);
            text-align: center;
        }

        .calc-box {
            width: 80px;
            padding: 15px;
            border: 1px solid #918dba;
        }

        input, select, button {
            width: 30%;
            padding: 6px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <h2>Calculator</h2>

    <input type="number" id="no1" placeholder="Enter first number" required><br><br>

    <select id="operator">
        <option value="sum"> + </option>
        <option value="subtract"> − </option>
        <option value="multiply"> × </option>
        <option value="divide"> ÷ </option>
    </select><br><br>

    <input type="number" id="no2" placeholder="Enter second number" required><br><br>

    <button onclick="equalSign()">=</button>

    <p id="cal"></p>

    <script>

        function addNumbers(n1, n2) {
            return n1 + n2;
        }

        function subNumbers(n1, n2) {
            return n1 - n2;
        }

        function mulNumbers(n1, n2) {
            return n1 * n2;
        }

        function divNumbers(n1, n2) {
            if (n2 === 0) return "Error: Cannot divide by zero";
            return n1 / n2;
        }

        function equalSign() {

            let n1 = parseFloat(document.getElementById("no1").value);
            let n2 = parseFloat(document.getElementById("no2").value);
            let op = document.getElementById("operator").value;

            let result;

            switch (op) {
                case "sum":
                    result = addNumbers(n1, n2);
                    break;

                case "subtract":
                    result = subNumbers(n1, n2);
                    break;

                case "multiply":
                    result = mulNumbers(n1, n2);
                    break;

                case "divide":
                    result = divNumbers(n1, n2);
                    break;
            }

            // Print output correctly
            if (typeof result === "string") {
                document.getElementById("cal").innerHTML = result; 
            } else {
                document.getElementById("cal").innerHTML = 
                    "The result is:<br>" + result.toFixed(2);
            }
        }
    </script>

</body>

</html>
