<h2>JavaScript Error Handling</h2>

<p>This example demonstrates how to use <b>catch</b> to diplay an error.</p>

<p id="demo"></p>

<script>
class Book
    def __init__(self, title, author, price):
        self.title = title
        self.author = author
        self.price = price

    // Getter methods
    def get_title(self):
        return self.title

    def get_author(self):
        return self.author

    // Setter method for price
    def set_price(self, new_price):
        if isinstance(new_price, (int, float)) and new_price > 0:
            self.price = new_price
            print(f"Price updated to {new_price}")
        else:
            print("Invalid price! Price must be a positive number.")

    # To print book details nicely
    def __str__(self):
        return f"Title: {self.title}, Author: {self.author}, Price: ${self.price}"
        

//--- Testing the Book class ---

book1 = Book("1984", "George Orwell", 15.99)

//Try updating with an invalid value
book1.set_price(-10)     # Invalid
book1.set_price("free")  # Invalid

// Try updating with a valid value
book1.set_price(20.50)   # Valid

//Print final book details
print(book1)

</script>
