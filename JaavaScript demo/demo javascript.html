

<!DOCTYPE html>
<html>
<head>
    <title>Reverse String</title>
</head>
<body>

<h2>Reverse a String</h2>

<form onsubmit="reverseString(event)">
    <input type="text" id="userInput" placeholder="Enter a string" required>
    <button type="submit">Reverse</button>
</form>

<p><strong>Reversed String:</strong> <span id="result"></span></p>

<script>
function reverseString(event) {
    event.preventDefault(); // Prevent form from reloading the page

    let str = document.getElementById("userInput").value;

    // Reverse the string
    let reversed = str.split("").reverse().join("");

    // Display output
    document.getElementById("result").textContent = reversed;
}
</script>

</body>
</html>
