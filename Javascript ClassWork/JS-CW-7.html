<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<body>
     <h2>Birthday tracker</h2>
    <P>Building a simple birthday tracker for Friends</p>
        <p id="bday"></p>

    <script>

let friend = {
    name: "John",
    birthDate: "1999-07-05"
};


function getBirthdayDetails(friendObj) {
    // Convert string to Date object
    const birth = new Date(friendObj.birthDate);

    // Extract details
    const year = birth.getFullYear();
    const day = birth.getDate();
    const monthName = birth.toLocaleString("default", { month: "long" });

    // Calculate age
    const today = new Date();
    let age = today.getFullYear() - year;

    // Check if birthday has passed this year
    const hasBirthdayPassed =
        today.getMonth() > birth.getMonth() ||
        (today.getMonth() === birth.getMonth() && today.getDate() >= day);

    if (!hasBirthdayPassed) {
        age -= 1;
    }


    
     document.getElementById("bday").innerHTML=`${friendObj.name} was born on ${day} ${monthName}, ${year} and is ${age} years old.`
}


getBirthdayDetails(friend);
</script>

</body>
</html>
