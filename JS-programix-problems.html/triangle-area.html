<body>
    <h2>Area of triangle</h2>
    <p id="area"></p>
    <script lang="javascript" type="text/javascript">
        let h = 25
        let b = 30
        let area = (b * h) / 2;
        document.getElementById("area").innerHTML = "Area of triangle having h=25 and b=30 is  " + area;
        console.log("Area of triangle having h=25 and b=30 is  " + area)
    </script>
</body>
